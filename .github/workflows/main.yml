name: Render CV

on:
  push:
    branches: [ main ] # or master, depending on your default branch name

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render CV
        run: |
          rendercv render Chinmay_Arangath_CV.yaml

      - name: Commit and Push Updated CV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update rendered CV artifacts"
          file_pattern: "rendercv_output/*"
