name: Render and Deploy CV

on:
  push:
    branches: [ main ] # Change to master if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render CV and standardise filename
        run: |
          rendercv render Chinmay_Arangath_CV.yaml

      - name: Commit updated CV back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update rendered CV output"
          file_pattern: "rendercv_output/*"
